<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>学分查询</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: #f5f5f5;
  min-height: 100vh;
}
.header {
  background: linear-gradient(135deg, #1a73e8, #1557b0);
  color: #fff;
  padding: 16px 20px;
  text-align: center;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 8px rgba(0,0,0,.15);
}
.header h1 { font-size: 20px; font-weight: 600; }
.header .stats { font-size: 13px; opacity: .85; margin-top: 4px; }
.header .update-time { font-size: 12px; opacity: .7; margin-top: 2px; }
.marquee {
  overflow: hidden;
  white-space: nowrap;
  background: #fff;
  border-bottom: 2px solid #c5221f;
}
.marquee-inner {
  display: inline-block;
  padding: 8px 0;
  animation: marquee 12s linear infinite;
  color: #c5221f;
  font-weight: 700;
  font-size: 15px;
  letter-spacing: 2px;
}
@keyframes marquee {
  0% { transform: translateX(100vw); }
  100% { transform: translateX(-100%); }
}
.notice-box {
  margin: 10px 12px;
  padding: 12px 14px;
  background: #fffbe6;
  border: 1px solid #ffe58f;
  border-radius: 10px;
  font-size: 13px;
  color: #8c6d00;
  line-height: 1.8;
}
.notice-box .notice-title {
  font-weight: 600;
  font-size: 14px;
  margin-bottom: 4px;
  color: #5c4700;
}
.notice-box .heart { color: #e81123; }
.search-box {
  padding: 12px 16px;
  background: #fff;
  border-bottom: 1px solid #e0e0e0;
  position: sticky;
  top: 80px;
  z-index: 99;
}
.search-input {
  width: 100%;
  height: 44px;
  border: 2px solid #e0e0e0;
  border-radius: 22px;
  padding: 0 20px;
  font-size: 16px;
  outline: none;
  transition: border-color .2s;
  background: #f8f9fa;
}
.search-input:focus { border-color: #1a73e8; background: #fff; }
.search-input::placeholder { color: #aaa; }
.result-info {
  padding: 8px 16px;
  font-size: 13px;
  color: #888;
  background: #fff;
}
.list { padding: 8px 0 80px; }
.card {
  margin: 8px 12px;
  background: #fff;
  border-radius: 12px;
  padding: 14px 16px;
  box-shadow: 0 1px 3px rgba(0,0,0,.08);
  cursor: pointer;
  transition: transform .15s;
}
.card:active { transform: scale(.98); }
.card-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}
.card-name {
  font-size: 17px;
  font-weight: 600;
  color: #222;
  flex: 1;
}
.card-badge {
  font-size: 12px;
  padding: 3px 10px;
  border-radius: 10px;
  font-weight: 500;
  white-space: nowrap;
  margin-left: 8px;
}
.badge-done { background: #e6f4ea; color: #1e7e34; }
.badge-undone { background: #fce8e6; color: #c5221f; }
.card-unit {
  font-size: 13px;
  color: #666;
  margin-top: 4px;
}
.card-scores {
  display: flex;
  gap: 16px;
  margin-top: 8px;
  font-size: 14px;
}
.score-item {
  display: flex;
  align-items: baseline;
  gap: 4px;
}
.score-label { color: #888; font-size: 12px; }
.score-val { font-weight: 600; color: #333; }
.score-val.gap { color: #c5221f; }
.score-val.ok { color: #1e7e34; }
.card-detail {
  display: none;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px dashed #e0e0e0;
}
.card-detail.show { display: block; }
.detail-row {
  display: flex;
  justify-content: space-between;
  padding: 4px 0;
  font-size: 13px;
  color: #555;
}
.detail-subject { flex: 1; }
.detail-scores { text-align: right; }
.detail-gap {
  color: #c5221f;
  font-weight: 500;
  margin-left: 8px;
}
.empty {
  text-align: center;
  padding: 60px 20px;
  color: #aaa;
}
.empty-icon { font-size: 48px; margin-bottom: 12px; }
.empty-text { font-size: 15px; }
.hint {
  text-align: center;
  padding: 40px 20px;
  color: #bbb;
  font-size: 14px;
}
.quick-links {
  display: flex;
  gap: 8px;
  padding: 10px 16px;
  background: #fff;
  border-bottom: 1px solid #e0e0e0;
  flex-wrap: wrap;
}
.quick-link {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 6px 12px;
  border-radius: 16px;
  font-size: 12px;
  text-decoration: none;
  border: 1px solid #e0e0e0;
  color: #1a73e8;
  background: #f0f6ff;
  transition: all .2s;
  white-space: nowrap;
}
.quick-link:active { background: #d2e3fc; }
.quick-link .link-icon { font-size: 14px; }

/* 学分明细查询 */
.credit-query-btn {
  display: block;
  width: 100%;
  margin-top: 10px;
  padding: 10px;
  background: linear-gradient(135deg, #1a73e8, #1557b0);
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: opacity .2s;
  text-decoration: none;
  text-align: center;
}
.credit-query-btn:active { opacity: .85; }
.credit-query-btn:disabled { background: #ccc; cursor: not-allowed; }
.credit-query-panel {
  display: none;
  margin-top: 10px;
  padding: 12px;
  background: #f8f9fa;
  border-radius: 10px;
  border: 1px solid #e0e0e0;
}
.credit-query-panel.show { display: block; }
.credit-loading {
  text-align: center;
  padding: 20px;
  color: #888;
  font-size: 14px;
}
.credit-loading .spinner {
  display: inline-block;
  width: 20px;
  height: 20px;
  border: 3px solid #e0e0e0;
  border-top-color: #1a73e8;
  border-radius: 50%;
  animation: spin .8s linear infinite;
  margin-right: 8px;
  vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }
.credit-error {
  color: #c5221f;
  font-size: 13px;
  padding: 8px 0;
  text-align: center;
}
.credit-result-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.credit-result-table th, .credit-result-table td {
  padding: 6px 8px;
  text-align: left;
  border-bottom: 1px solid #e0e0e0;
}
.credit-result-table th {
  background: #f0f6ff;
  color: #1a73e8;
  font-weight: 500;
}
.credit-result-table .col-name { width: 45%; }
.credit-result-table .col-cat { width: 25%; }
.credit-result-table .col-score { width: 15%; text-align: center; }
.credit-result-table .col-time { width: 15%; text-align: center; }
.credit-summary {
  margin-top: 8px;
  padding: 8px 10px;
  background: #e6f4ea;
  border-radius: 6px;
  font-size: 13px;
  color: #1e7e34;
  text-align: center;
  font-weight: 500;
}

.footer {
  text-align: center;
  padding: 16px;
  font-size: 12px;
  color: #bbb;
  position: fixed;
  bottom: 0;
  width: 100%;
  background: #f5f5f5;
}
</style>
</head>
<body>

<div class="header">
  <h1>2026年继续医学教育学分查询</h1>
  <div class="stats">共 <span id="totalCount">-</span> 人，已达标 <span id="doneCount">-</span> 人</div>
  <div class="update-time" id="updateTime"></div>
</div>

<div class="marquee"><div class="marquee-inner">第一步国家平台上分→第二步省平台上分→第三步地市州平台查分</div></div>

<div class="notice-box">
  <div class="notice-title">26年学分查分流程</div>
  国家平台（先上）☞ 省/市级平台（后上），自己可以不间断在省/市平台查分！！！<br>
  <span class="heart">♥♥♥</span> 只要国家平台能查到学分，就没的问题了，省/市级查分系统，晚一点同步数据过去。（✅ 着急用学分的老师，可以先从国家平台打印学分证明。）<br>
  <br>
  原始学习网站账号为：<b>身份证号</b>，密码为 <b>Aa@123456</b>
</div>

<div class="search-box">
  <input type="text" class="search-input" id="searchInput"
    placeholder="输入完整姓名或18位身份证号查询"
    autocomplete="off" autocorrect="off" autocapitalize="off">
  <div class="quick-links" style="padding:8px 0 0; border-bottom:none; background:transparent;">
    <a href="https://www.jumingedu.com/" target="_blank" class="quick-link">
      <span class="link-icon">📚</span> 原始学习网址
    </a>
    <a href="https://icme.chinacpd.cn/certificateQuery" target="_blank" class="quick-link">
      <span class="link-icon">🔗</span> 国家平台查询
    </a>
    <a href="http://202.61.90.26:9000/#/?functionType=creditQuery" target="_blank" class="quick-link">
      <span class="link-icon">🔗</span> 省平台查询
    </a>
  </div>
</div>

<div class="result-info" id="resultInfo" style="display:none"></div>
<div class="list" id="list"></div>

<div class="footer">数据来源：26年工作表格 · 更新时间：2026年8月8日</div>

<script>
// 数据将在页面加载后通过 fetch 获取
let DATA = [];
let dataLoaded = false;
const MAX_RESULTS = 200;
const BACKEND_URL = 'https://credit-uery-api-ivufmamtlh.cn-hangzhou.fcapp.run';

async function loadData() {
  const ossUrl = 'https://credit-query-data.oss-cn-hangzhou.aliyuncs.com/query_compact.json';
  const cdnUrl = 'https://cdn.jsdelivr.net/gh/liangxiuqingfeng87/credit-query@main/query_compact.json';
  const localUrl = 'query_compact.json';

  for (const baseUrl of [ossUrl, localUrl, cdnUrl]) {
    try {
      const resp = await fetch(baseUrl + '?t=' + Date.now());
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const raw = await resp.json();
      // 兼容新旧格式：新格式 {data:[...], updated:"..."}, 旧格式 [...]
      if (Array.isArray(raw)) {
        DATA = raw;
      } else {
        DATA = raw.data || [];
        if (raw.updated) {
          document.getElementById('updateTime').textContent = '数据更新：' + raw.updated;
        }
      }
      dataLoaded = true;
      updateStats();
      showHint();
      return;
    } catch(e) {
      console.warn('数据源加载失败，尝试下一个:', baseUrl, e);
    }
  }

  document.getElementById('list').innerHTML = '<div class="empty"><div class="empty-text">数据加载失败，请检查网络后刷新重试</div></div>';
}

function updateStats() {
  const total = DATA.length;
  const done = DATA.filter(p => p.dn).length;
  document.getElementById('totalCount').textContent = total;
  document.getElementById('doneCount').textContent = done;
}

function showHint() {
  document.getElementById('list').innerHTML = '<div class="hint">在上方输入姓名或身份证号开始查询</div>';
}

function search(query) {
  if (!dataLoaded) return;
  const q = query.trim();
  if (!q) {
    showHint();
    document.getElementById('resultInfo').style.display = 'none';
    return;
  }

  // 精确匹配：姓名完全一致 或 身份证号完全一致
  const results = [];
  for (const p of DATA) {
    if (p.n === q || p.i === q) {
      results.push(p);
      if (results.length >= MAX_RESULTS) break;
    }
  }

  document.getElementById('resultInfo').style.display = results.length ? 'block' : 'none';
  document.getElementById('resultInfo').textContent = results.length
    ? `找到 ${results.length} 条结果` + (results.length >= MAX_RESULTS ? '（仅显示前200条）' : '')
    : '';

  const listEl = document.getElementById('list');
  if (!results.length) {
    listEl.innerHTML = '<div class="empty"><div class="empty-icon">🔍</div><div class="empty-text">未找到匹配结果</div></div>';
    return;
  }

  const isIdSearch = /^\d{17}[\dXx]$/.test(q);
  listEl.innerHTML = results.map(p => {
    const badgeClass = p.dn ? 'badge-done' : 'badge-undone';
    const badgeText = p.dn ? '已达标' : (p.j || `差${p.g}分`);
    const gapClass = p.dn ? 'ok' : 'gap';
    const gapText = p.dn ? '已完成' : `差${p.g}分`;

    let detailHtml = '';
    if (p.s && p.s.length > 0) {
      detailHtml = p.s.map(s => {
        const sg = s.r - s.sc;
        return `<div class="detail-row">
          <span class="detail-subject">${s.sn}</span>
          <span class="detail-scores">${s.sc}/${s.r}分${sg > 0 ? `<span class="detail-gap">差${sg}分</span>` : ' ✅'}</span>
        </div>`;
      }).join('');
    }

    // 学分明细查询按钮（仅在身份证号搜索时显示）
    const creditQueryHtml = isIdSearch ? `
      <button class="credit-query-btn" id="cqbtn-${p.i}" onclick="event.stopPropagation();queryCreditDetail('${p.i}')">
        查询当日最新学分明细
      </button>
      <div class="credit-query-panel" id="cqpanel-${p.i}">
        <div class="credit-loading" id="cqloading-${p.i}" style="display:none;"><span class="spinner"></span>正在查询当日最新学分明细...</div>
        <div class="credit-error" id="cqerror-${p.i}" style="display:none;"></div>
        <div class="credit-result-table" id="cqresult-${p.i}" style="display:none;"></div>
        <div class="credit-summary" id="cqsummary-${p.i}" style="display:none;"></div>
      </div>` : '';

    return `<div class="card" onclick="this.querySelector('.card-detail').classList.toggle('show')">
      <div class="card-top">
        <span class="card-name">${p.n}</span>
        <span class="card-badge ${badgeClass}">${badgeText}</span>
      </div>
      <div class="card-unit">${p.u || ''}${p.p ? ' · 手机号前缀: ' + p.p + '****' : ''}</div>
      <div class="card-scores">
        <div class="score-item"><span class="score-label">所需</span><span class="score-val">${p.tr}</span></div>
        <div class="score-item"><span class="score-label">已得</span><span class="score-val">${p.ts}</span></div>
        <div class="score-item"><span class="score-label">差距</span><span class="score-val ${gapClass}">${gapText}</span></div>
      </div>
      ${detailHtml ? `<div class="card-detail">${detailHtml}</div>` : ''}
      ${detailHtml ? '<div style="text-align:center;color:#aaa;font-size:11px;margin-top:4px;">点击查看学科明细</div>' : ''}
      ${creditQueryHtml}
    </div>`;
  }).join('');
}

document.getElementById('searchInput').addEventListener('input', function(e) {
  search(e.target.value);
});

// ========== 学分明细查询（阿里云FC同步模式，24小时在线） ==========
window.queryCreditDetail = async function(idNumber) {
  console.log('[学分查询] 开始查询:', idNumber);

  var panel = document.getElementById('cqpanel-' + idNumber);
  var btn = document.getElementById('cqbtn-' + idNumber);
  var loading = document.getElementById('cqloading-' + idNumber);
  var errorEl = document.getElementById('cqerror-' + idNumber);
  var resultEl = document.getElementById('cqresult-' + idNumber);
  var summaryEl = document.getElementById('cqsummary-' + idNumber);

  if (!panel || !btn) {
    console.error('[学分查询] DOM元素缺失');
    return;
  }

  // 显示面板和加载动画
  panel.classList.add('show');
  loading.style.display = 'block';
  loading.innerHTML = '<span class="spinner"></span>正在查询当日最新学分明细（预计15-30秒）...';
  errorEl.style.display = 'none';
  resultEl.style.display = 'none';
  summaryEl.style.display = 'none';
  btn.disabled = true;
  btn.textContent = '查询中...';
  panel.scrollIntoView({ behavior: 'smooth', block: 'center' });

  console.log('[学分查询] 发送请求:', BACKEND_URL + '/api/credit/query');

  try {
    // 同步查询：直接等待结果返回
    var resp = await fetch(BACKEND_URL + '/api/credit/query', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id_number: idNumber })
    });
    var data = await resp.json();
    console.log('[学分查询] 收到结果:', data);

    loading.style.display = 'none';

    if (data.success && data.items && data.items.length > 0) {
      var html = '<table class="credit-result-table"><thead><tr>' +
        '<th class="col-name">课程名称</th>' +
        '<th class="col-cat">学分类别</th>' +
        '<th class="col-score">分值</th>' +
        '<th class="col-time">考核时间</th>' +
        '</tr></thead><tbody>';

      for (var j = 0; j < data.items.length; j++) {
        var item = data.items[j];
        html += '<tr><td>' + (item.course_name || '-') + '</td>' +
          '<td>' + (item.category || '-') + '</td>' +
          '<td class="col-score">' + (item.score || 0) + '</td>' +
          '<td class="col-time">' + (item.exam_time || '-') + '</td></tr>';
      }
      html += '</tbody></table>';
      resultEl.innerHTML = html;
      resultEl.style.display = 'block';
      summaryEl.innerHTML = '共 <b>' + data.total_courses + '</b> 门课程，总学分 <b>' + data.total_credits + '</b> 分';
      summaryEl.style.display = 'block';
    } else if (data.success) {
      errorEl.textContent = '未查询到学分明细数据';
      errorEl.style.display = 'block';
    } else {
      errorEl.textContent = data.error || '查询失败';
      errorEl.style.display = 'block';
    }
  } catch (e) {
    console.error('[学分查询] 异常:', e);
    loading.style.display = 'none';
    errorEl.textContent = e.message || '网络错误，请检查连接后重试';
    errorEl.style.display = 'block';
  }

  btn.disabled = false;
  btn.textContent = '查询当日最新学分明细';
};

// 初始加载
loadData();
</script>
</body>
</html>
