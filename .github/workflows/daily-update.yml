name: 每日学分数据更新

on:
  schedule:
    # 北京时间每天早上 8:00 (UTC+0)
    - cron: '0 0 * * *'
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r scripts/requirements.txt

      - name: 拉取数据并更新
        env:
          TENCENT_DOCS_COOKIE: ${{ secrets.TENCENT_DOCS_COOKIE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_data.py
